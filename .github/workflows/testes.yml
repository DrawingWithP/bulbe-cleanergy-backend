name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Backend, sistema de gerenciamento e integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            sistema-de-gerenciamento/requirements*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Migrations alinhadas aos modelos
        working-directory: backend
        env:
          BULBE_DATABASE_URL: sqlite:///${{ runner.temp }}/ci-migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Testes do backend
        working-directory: backend
        run: python -m pytest

      - name: Testes do sistema de gerenciamento
        working-directory: sistema-de-gerenciamento
        run: python -m pytest

      - name: Preservação do frontend original
        run: python integration-tests/check_preservation.py

      - name: App e sistema de gerenciamento integrados
        run: python integration-tests/test_sistemas_integrados.py

  navegador:
    name: Frontend no navegador (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install -r backend/requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Teste de navegador
        run: python integration-tests/test_browser.py
